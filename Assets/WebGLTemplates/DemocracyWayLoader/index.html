<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="LoaderAssets/account.css">
  <style>
    @font-face{font-family:Kargo;src:url('LoaderAssets/IFKargoSans-Regular.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101f24;color:#e8dfcb;font-family:Kargo,sans-serif;cursor:url('LoaderAssets/Cursor.png') 3 2,default}
    #unity-canvas{display:block;width:100%;height:100%;outline:none;background:#101f24}
    #loading{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 32%,#284247,#101f24 72%);transition:opacity .35s;z-index:10}
    #stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;display:grid;place-items:center}
    .loader-core{text-align:center;margin-top:-25px}.loader-logo{display:block;width:530px;height:310px;object-fit:contain;margin:auto}
    #track{width:470px;height:12px;margin:56px auto 23px;border:1px solid #ae9661;background:#183238;position:relative;padding:3px}
    #track:before,#track:after{content:'';position:absolute;top:-6px;width:20px;height:20px;border:1px solid #ae9661;transform:rotate(45deg);background:#11272d}
    #track:before{left:-22px}#track:after{right:-22px}#fill{display:block;height:4px;width:0;background:linear-gradient(90deg,#65795f,#c7ae72);transition:width .12s linear}
    #progress{font-size:15px;letter-spacing:.16em;color:#c7bb98}#percent{color:#a9b4a0;margin-left:18px}.foot{position:absolute;bottom:45px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.08em;color:#8fa697}
    #error{display:none;max-width:650px;margin:25px auto;color:#eed6c5;font-size:20px;line-height:1.5;letter-spacing:0}#loading.done{opacity:0;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Οδός Δημοκρατίας"></canvas>
  <div id="loading"><div id="stage"><div class="loader-core">
    <img class="loader-logo" src="LoaderAssets/Logo.png" alt="Οδός Δημοκρατίας">
    <div id="track" role="progressbar" aria-label="Φόρτωση παιχνιδιού" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
    <div id="progress">Η ΠΟΛΗ ΞΥΠΝΑ <span id="percent">0%</span></div><p id="error" role="alert"></p>
  </div></div></div>
  <script src="LoaderAssets/research.js"></script>
  <script src="LoaderAssets/account.js"></script>
  <script>
    const fit=()=>document.documentElement.style.setProperty('--fit',Math.min(innerWidth/1600,innerHeight/900));fit();addEventListener('resize',fit);
    const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');
    const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}',matchWebGLToCanvasSize:true,autoSyncPersistentDataPath:true};
    function fail(error){console.error(error);const box=document.getElementById('error');box.style.display='block';box.textContent='Δεν ολοκληρώθηκε η φόρτωση. Ανανέωσε τη σελίδα ή δοκίμασε ξανά σε ενημερωμένο browser.';document.getElementById('progress').textContent='ΑΠΟΤΥΧΙΑ ΦΟΡΤΩΣΗΣ';}
    const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
    script.onload=()=>createUnityInstance(canvas,config,p=>{const n=Math.round(Math.max(0,Math.min(1,p))*100);document.getElementById('fill').style.width=n+'%';document.getElementById('percent').textContent=n+'%';document.getElementById('track').setAttribute('aria-valuenow',String(n));}).then(instance=>{window.democracyWayInstance=instance;loading.classList.add('done');setTimeout(()=>loading.remove(),380);window.DWAccount.attach(instance);}).catch(fail);
    script.onerror=()=>fail('Δεν βρέθηκε το Unity loader script.');document.body.appendChild(script);
  </script>
</body>
</html>
